<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Aethernal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Fonts selbst gehostet (11.09.2026). Cormorant Garamond wurde einmalig
       heruntergeladen und liegt lokal - das Aussehen bleibt damit unveraendert. -->
  <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:'Inter';src:url('/fonts/inter-var-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
    @font-face{font-family:'Cormorant Garamond';src:url('/fonts/cormorant-garamond-var-latin.woff2') format('woff2');font-weight:300 700;font-style:normal;font-display:swap;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',sans-serif;
      background:#1E1B4B;color:#F0EDF8;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;padding:2rem;
    }
    .code{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(5rem,15vw,10rem);font-weight:300;
      color:#C97A2B;line-height:1;margin-bottom:0.25rem;
      opacity:0.7;
    }
    h1{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(1.6rem,4vw,2.4rem);font-weight:400;
      margin-bottom:1rem;
    }
    p{
      color:rgba(240,237,248,0.55);font-size:0.95rem;
      line-height:1.7;max-width:400px;margin-bottom:2rem;
    }
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:14px 28px;border-radius:8px;
      font-size:14px;font-weight:600;
      background:#C97A2B;color:#1A1830;
      text-decoration:none;transition:all 0.2s;
    }
    .btn:hover{background:#E09548;transform:translateY(-1px)}
    .logo{
      position:absolute;top:24px;left:24px;
      font-family:'Cormorant Garamond',serif;
      font-size:18px;font-weight:600;letter-spacing:0.18em;
      color:rgba(240,237,248,0.5);text-decoration:none;
    }
    .logo:hover{color:#C97A2B}
  </style>
</head>
<body>
  <a href="/" class="logo">AETHERNAL</a>
  <div class="code">404</div>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht wurde sie verschoben oder existiert nicht mehr. Kein Grund zur Sorge.</p>
  <a href="/" class="btn">Zur Startseite →</a>
</body>
</html>
